name: Ping
on:
  push:
    paths: ['.github/workflows/ping.yml']
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write report to ci-reports branch
        run: |
          mkdir -p /tmp/r && cd /tmp/r
          echo "ping ok $(date -u) node $(node -v) java $(java -version 2>&1 | head -1) android=$ANDROID_HOME" > ping.md
          git init -q && git checkout -q -b ci-reports
          git config user.name "kitty-ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "ping report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-reports
