name: One-off cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete releases and tags that point at the old, unscrubbed history
        run: |
          for t in app-v0.1.5 app-v0.1.6 app-v0.1.8 app-v0.1.9 app-v0.1.10; do
            gh release delete "$t" --cleanup-tag --yes && echo "deleted $t" || echo "no release for $t"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" 2>/dev/null && echo "deleted tag $t" || true
          done
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/ci-reports" 2>/dev/null && echo "deleted ci-reports" || true
          echo "--- tags left:"; gh api "repos/$GH_REPO/git/matching-refs/tags" --jq '.[].ref'
          echo "--- releases left:"; gh release list
