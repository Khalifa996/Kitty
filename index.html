<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitty">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kitty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app shell. One scrolling screen above a four-tab bar; Log (the keypad) is the landing screen. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --outer:#050608;
  --bg:#0A0C0F;
  --surface:#15181D;
  --surface-2:#1F232A;
  --line:#272C34;
  --fg:#F1F3F6;
  --muted:#8D95A1;
  --faint:#59606B;
  --gold:#F2C14E;
  --gold-ink:#1C1505;
  --good:#3DD68C;
  --warn:#FF9A3D;
  --bad:#FF5C6C;
  --font-num:'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html{height:100%;box-sizing:border-box;background:var(--outer);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overscroll-behavior:none}
button{-webkit-user-select:none;user-select:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--outer);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;display:block}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line)}}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.tab{background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1 var(--font-body);padding:6px 0;cursor:pointer}
.tab .i{font-size:22px}
.tab.on{color:var(--fg)}
.tab.on .i{color:var(--gold)}

.k{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.x{font-size:12.5px;color:var(--muted);margin-top:3px}
.hint{font-size:13px;color:var(--muted);margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* Log */
.log{display:flex;flex-direction:column;gap:8px;min-height:100%}
.strip{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px}
.strip .r{text-align:right;min-width:0}
.big{display:block;font:600 24px/1.15 var(--font-num);color:var(--good);font-variant-numeric:tabular-nums;margin-top:3px}
.big.bad{color:var(--bad)}
.after{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.after.bad{color:var(--bad)}
.after.good{color:var(--good)}
.seg{align-self:center;display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--fg)}
.amount{text-align:center;font:600 clamp(40px,12vw,52px)/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:2px 0}
.amount .cur{font-size:.5em;color:var(--muted);margin-right:4px;vertical-align:.45em}
.amount.in{color:var(--good)}
.amount .ph{color:var(--faint)}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;height:44px}
.field .i{font-size:18px;color:var(--muted)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:500 16px var(--font-body);outline:none}
.field input::placeholder{color:var(--faint)}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 16px 0;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip .dot,.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.chip .s{color:var(--muted);font-weight:500}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.on .s{color:var(--surface-2)}
.chip.ghost{background:none;color:var(--muted);font-weight:500;padding-inline:4px;cursor:default}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cat{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 4px;border-radius:12px;cursor:pointer;color:var(--muted);min-width:0}
.cat .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:19px;transition:transform .15s}
.cat .lbl{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-inline:2px}
.cat.on{color:var(--fg);background:var(--surface)}
.cat.on .ic{background:var(--c);color:#0A0C0F;transform:scale(1.05)}
.cat .auto{position:absolute;top:5px;left:calc(50% + 13px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}
.extra{display:flex;flex-direction:column;gap:8px}
.note{background:var(--surface);border:0;border-radius:12px;height:42px;padding:0 12px;color:var(--fg);font:500 16px var(--font-body)}
.inline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.inline select{background:var(--surface);border:0;border-radius:10px;height:36px;padding:0 10px;color:var(--fg);font:600 14px var(--font-body)}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}
.meta .sp{flex:1;min-width:0}
.pill{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border:0;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.pill .i{font-size:16px}
.pill.on{background:var(--surface-2);color:var(--fg)}
.pill.biz.on{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pill input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.key{height:clamp(42px,6.2vh,58px);border:0;border-radius:14px;background:var(--surface);font:500 24px var(--font-num);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;transition:transform .08s,background .08s}
.key:active{background:var(--surface-2);transform:scale(.97)}
.key .i{font-size:24px}
.save{height:50px;flex:none;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);font:800 17px var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.save:disabled{background:var(--surface);color:var(--faint);cursor:default}

/* Shared screen bits */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.hd h1{margin:0;font:600 26px/1.1 var(--font-num);letter-spacing:-.01em}
.hd .sub{color:var(--muted);font-size:13px;margin-top:5px}
.iconbtn{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg);font-size:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:18px;padding:16px;min-width:0}
.h2{font:700 15px var(--font-body);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h2 small{color:var(--muted);font-weight:500;font-size:12px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--gold))}
.ic{display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.ic.sm{width:30px;height:30px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;height:48px;border:0;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:15px;cursor:pointer;padding:0 16px}
.btn .i{font-size:18px}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.wide{width:100%;flex:none}
.form > .btn{flex:none}
.btn.sm{height:40px;flex:none;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:48px 8px}

/* Activity */
.group{margin-top:16px}
.ghd{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 4px 7px}
.ghd span+span{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;font-size:12px}
.rows{background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 14px;text-align:left;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .ic{width:38px;height:38px;font-size:18px}
.row .mid{flex:1;min-width:0;display:block}
.row .t{display:flex;gap:6px;align-items:center;font-weight:700;font-size:15px;min-width:0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .s{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .amt{font:600 15px var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt.in{color:var(--good)}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);flex:none}
.tag.bill{background:color-mix(in srgb,#A78BFA 20%,transparent);color:#B9A3FF}
.filters{padding-bottom:2px}

/* Bills */
.brow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.brow+.brow{border-top:1px solid var(--line)}
.dbox{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0 5px}
.dbox b{display:block;font:600 19px/1 var(--font-num)}
.dbox span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-top:3px}
.brow.paid .dbox{opacity:.45}
.brow .mid{flex:1;min-width:0}
.bname{border:0;background:none;padding:0;font:700 15px var(--font-body);text-align:left;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.brow .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.brow .s.over{color:var(--bad)}
.brow .s.soon{color:var(--warn)}
.bright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bright .amt{font:600 15px var(--font-num);font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.status .i{font-size:13px}
.status.paid{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.status.due{background:var(--surface-2);color:var(--fg)}
.status.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.status.over{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.hv{font:600 30px/1.1 var(--font-num);font-variant-numeric:tabular-nums;margin-top:6px}
.hv.good{color:var(--good)} .hv.warn{color:var(--warn)} .hv.bad{color:var(--bad)}

/* Insights */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px;min-width:0}
.tile .v{font:600 17px var(--font-num);font-variant-numeric:tabular-nums;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block;overflow:visible}
.cl{font:700 10px var(--font-body);fill:var(--muted)}
.cl.gold{fill:var(--gold)}
.crow{display:grid;grid-template-columns:30px 1fr auto;gap:6px 10px;align-items:center;padding:10px 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .vv{font:600 14px var(--font-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .vv small{color:var(--muted);font-weight:500;font-size:12px}
.crow .bar,.crow .dl{grid-column:2/4}
.crow .dl{font-size:12px;color:var(--muted)}
.crow .dl.up{color:var(--warn)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mrow .vv{font:600 14px var(--font-num);font-variant-numeric:tabular-nums}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bgrid .v{font:600 18px var(--font-num);font-variant-numeric:tabular-nums;margin-top:5px}
.banner{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:16px;padding:14px}
.banner .i{font-size:20px;color:var(--gold);margin-top:1px}
.banner p{margin:0;font-size:13.5px;color:var(--fg)}
.banner button{margin-top:8px;border:0;background:none;padding:0;color:var(--gold);font-weight:800;font-size:13.5px;cursor:pointer}

/* Sheet + toast */
#sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);border:0;padding:0;cursor:pointer}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:90%;overflow-y:auto;padding:10px 16px 22px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font:600 20px var(--font-num)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;min-width:0}
.form input,.form select,.form textarea{width:100%;background:var(--surface-2);border:0;border-radius:10px;height:44px;padding:0 12px;color:var(--fg);font:500 16px var(--font-body);text-transform:none;letter-spacing:0}
.form input.err{box-shadow:inset 0 0 0 2px var(--bad)}
.form textarea{height:180px;padding:10px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{font:700 15px var(--font-body);margin-top:10px}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label.lim{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:0 4px 0 12px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg);font-weight:600}
.form label.lim span{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap}
.form label.lim input{width:54px;flex:none;text-align:right;background:none;padding:0 8px;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:4px}
.ghd{align-items:center;gap:10px}
.glink,.link{border:0;background:none;padding:0;color:var(--gold);font:800 12px var(--font-body);cursor:pointer;letter-spacing:0;text-transform:none}
.link{font-size:12px;text-align:left}
.bsect .ghd{padding-top:4px}
.paybar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 4px}
.paybar i{display:block;height:100%;background:var(--c);min-width:3px}
.prow{display:grid;grid-template-columns:10px 1fr auto 40px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .nm{font-weight:700;min-width:0}
.prow .vv{font:600 14px var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.prow .pc{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.prow.total{font-weight:800}
.prow.total .vv{color:var(--good)}
.prow.total.short .vv{color:var(--bad)}
.warnline{color:var(--warn)!important}
.form label.chk{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);font-weight:500;cursor:pointer}
.form label.chk+label.chk{border-top:1px solid var(--line)}
.form label.chk input{width:22px;height:22px;flex:none;padding:0;accent-color:var(--gold)}
.chk span{display:flex;flex-direction:column;gap:2px;min-width:0}
.chk small{color:var(--muted);font-size:12.5px}
#setup{position:absolute;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding:14px 16px 24px}
.ob{display:flex;flex-direction:column;gap:16px;min-height:100%}
.obtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--surface-2)}
.dots i.on{background:var(--gold)}
.ob h1{font:600 28px/1.15 var(--font-num);margin:0;letter-spacing:-.01em;text-wrap:balance}
.ob .lead{color:var(--muted);font-size:15.5px;margin:0;line-height:1.45}
.ob .grow{flex:1}
.ob > .btn,.ob > .save{flex:none}
.ob .small{font-size:13px;color:var(--muted);text-align:center;margin:0}
.obhero{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.obhero .strip{transform:rotate(-1.5deg)}
.obhero .strip+.strip{transform:rotate(1deg);opacity:.75}
.money{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:14px;padding:0 16px;height:66px}
.money span{font:600 26px var(--font-num);color:var(--muted)}
.money input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:600 30px var(--font-num);outline:none;font-variant-numeric:tabular-nums}
.money:focus-within{box-shadow:inset 0 0 0 2px var(--gold)}
.money.err{box-shadow:inset 0 0 0 2px var(--bad)}
.obhead{display:grid;grid-template-columns:minmax(0,1fr) 92px 82px;gap:6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.obrows{display:flex;flex-direction:column;gap:8px}
.obrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 82px;gap:6px}
.obrow input,.obrow select{height:44px;background:var(--surface);border:0;border-radius:10px;color:var(--fg);padding:0 10px;font:500 15px var(--font-body);min-width:0;width:100%}
.obrow input.a{font-family:var(--font-num);text-align:right;font-variant-numeric:tabular-nums}
.obrow input:focus,.obrow select:focus{outline:2px solid var(--gold);outline-offset:-2px}
.sumcard{background:var(--surface);border-radius:16px;padding:6px 16px 12px}

.toggle input{width:22px;height:22px;flex:none;accent-color:var(--gold);margin:0}
.toggle span{display:flex;flex-direction:column;gap:3px;min-width:0;font-weight:700}
.form label.toggle{flex-direction:row;align-items:center;gap:12px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:700;color:var(--fg);background:var(--surface-2)}
.form label.toggle input{width:22px;height:22px;padding:0}
.toggle small{font-weight:500;color:var(--muted);font-size:13px}
.bbtns{display:flex;gap:16px;flex-wrap:wrap}
.status.auto{background:var(--surface-2);color:var(--muted);cursor:default}
.potsel{padding-top:0}
.catrow{display:grid;grid-template-columns:30px minmax(0,1fr) 34px 34px 34px auto;gap:6px;align-items:center;padding:8px 10px}

.catrow.off{opacity:.45}
.form .catrow input{height:38px;background:var(--surface-2);font-size:15px}
.mini{width:34px;height:34px;border:0;border-radius:9px;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;cursor:pointer;font-size:16px;padding:0}
.picker{display:flex;flex-wrap:wrap;gap:8px}

.pick.on{background:var(--gold);color:var(--gold-ink)}
.sw{width:36px;height:36px;border-radius:50%;border:0;background:var(--c);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--fg)}
.potcard .hv small.of{font-size:15px;color:var(--muted);font-weight:500}
.potcard .s{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.potcard .s.over{color:var(--bad)} .potcard .s.good{color:var(--good)}
svg.i.inl{display:inline-block;vertical-align:-2px;color:#3DD6B0}
.nudge{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));color:var(--fg);padding:10px 12px;font:600 13px var(--font-body);text-align:left;cursor:pointer}

.lbl2{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.lead2{margin:0;font-size:15px;line-height:1.45}

function incomeFor(c){ const got = sum(txIn(c).filter(t => t.kind==='in' && t.cat==='salary' && !t.biz)); return got>0 ? got : S.settings.income; }

}

// Kitty knows what you logged; your bank knows what you have. The gap is spending you didn't log.

function catBtn(k, src, d){

function applyMem(m){

function keyIn(v){
  let a = draft.amt;

  else {
    if (a==='0') a = '';

function doSave(){
  const p = pennies(); if (p<=0) return;
  const d = draft;
  const t = {id:uid(), kind:d.mode, amt:p, cat:d.cat, sub:d.sub||null, merchant:d.merchant.trim(), note:d.note.trim(), date:d.date, time:d.date===today()?nowHM():'12:00', biz:bizOn() && (d.mode==='out' ? d.biz : d.cat==='side'), billId:null};

  if (t.kind==='out' && d.potId && !t.biz) t.potId = d.potId;

  const lc = lastCheckin(), adj = lc && lc.adjTx && S.tx.find(x => x.id===lc.adjTx);
  let took = 0;
  if (adj && adj.kind==='out' && t.kind==='out' && !t.potId && stamp(t) <= lc.at){ took = Math.min(adj.amt, t.amt); adj.amt -= took; if (!adj.amt) S.tx = S.tx.filter(x => x!==adj); }
  persist(); buzz();
  draft = newDraft(d.mode);
  render();
  toast(`Saved ${fmt(p)} · ${t.merchant || catOf(t).n}${took ? `. Taken off "Not logged"` : ''}`, () => {
    S.tx = S.tx.filter(x => x.id!==t.id);
    if (took){ const a2 = S.tx.find(x => x.id===lc.adjTx); if (a2) a2.amt += took; else if (adj){ adj.amt = took; S.tx.push(adj); } }
    persist(); render(); });
}

/* ---------- Bills ---------- */
const BILL_TYPES = {bill:'Bill', sub:'Subscription', debt:'Debt repayment'};
const DEBT_RX = /\b(barclaycard|amex|american express|credit ?card|monzo flex|flex|paypal|klarna|clearpay|laybuy|loan|finance|overdraft|capital ?one|vanquis|aqua|zopa|novuna|tymit|int|interest)\b/i;
const BIZ_RX = /\b(simply business|hiscox|public liability|xero|quickbooks|freeagent|van insurance|trade insurance)\b/i;
function billSuggestions(){
  const d = S.settings.dismissed || {}, out = [];
  for (const b of S.bills){
    if (b.type!=='debt' && !d[b.id+':debt'] && DEBT_RX.test(b.name)) out.push({b, to:'debt'});
    if (bizOn() && !b.biz && !d[b.id+':biz'] && BIZ_RX.test(b.name)) out.push({b, to:'biz'});
  }
  return out;
}
const andList = a => a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const monthLabel = d => d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const paidIn = (b,c) => S.tx.find(x => x.billId===b.id && x.date>=c.start && x.date<=c.end) || ((S.settings.prepaid||{})[b.id]===c.start ? {date:c.start, pre:true} : null);
function debtLeft(b){
  if (!b.balance) return null;
  const at = b.balanceAt || '';
  const after = t => (t.date+' '+t.time) > at;
  return Math.max(0, b.balance - sum(S.tx.filter(t => t.billId===b.id && after(t))) + sum(S.tx.filter(t => t.kind==='in' && t.cat==='borrowed' && t.debtId===b.id && after(t))));
}
function debtFree(b, c){
  const left = debtLeft(b); if (left===null) return null;
  if (left<=0) return {left:0, date:null};
  const n = Math.ceil(left/b.amt), due = parse(billDue(b,c));
  const first = paidIn(b,c) ? new Date(due.getFullYear(), due.getMonth()+1, 1, 12) : new Date(due.getFullYear(), due.getMonth(), 1, 12);
  return {left, n, date:new Date(first.getFullYear(), first.getMonth()+n-1, 1, 12)};
}
function billRow({b,due,p}, t){

  return `<div class="brow ${p?'paid':''}"><div class="dbox"><b>${dd.getDate()}</b><span>${dd.toLocaleDateString('en-GB',{month:'short'})}</span></div>
    <div class="mid"><button class="bname" data-act="bill-edit" data-v="${b.id}">${esc(b.name)}</button><span class="s ${scls}">${b.biz?'Business · ':''}${kind}${sline}</span></div>

function renderBills(){

      <div class="x" style="margin:0 0 6px;font-size:14px;color:var(--fg)">${fmtS(debtM)} a month${inc>0 ? `, ${Math.round(debtM/inc*100)}% of your pay` : ''}.${allKnown && last ? ` All cleared by <b>${monthLabel(last)}</b> at these payments.` : allKnown ? ' All paid off.' : ''}</div>

      ${sect('Due now', dueNow, dueNow.length>1 ? `<button class="glink" data-act="pay-due">Mark all ${dueNow.length} paid</button>` : '')}
      ${sect('Coming up', later)}
      ${debtCard}
      ${subs.length ? `<div class="card"><div class="h2">Subscriptions<small>${subs.length} active</small></div><div class="x" style="margin:0;font-size:14px;color:var(--fg)">${fmt(subsM)} a month is <b class="num">${fmtS(subsM*12)}</b> a year.</div></div>` : ''}
      ${sect(monthly ? 'Paid this cycle' : 'Paid this month', done)}
    </div>`;
}
function syncBiz(b){ S.tx.forEach(t => { if (t.billId===b.id) t.biz = !!b.biz; }); }
function autoPay(){
  const t = today(), skip = S.settings.ddSkip || {}, w = billWindow();
  const wins = [w, billWindowAt(ymd(addDays(parse(w.start),-1)))];
  let n = 0;
  for (const b of S.bills){
    if (!b.dd) continue;
    for (const win of wins){
      const due = billDue(b, win);
      if (due > t || due < (b.ddFrom||'') || skip[b.id+':'+win.start] || paidIn(b, win)) continue;
      S.tx.push({...payTx(b), date:due, time:'06:00', auto:true}); n++;
    }
  }
  if (n) persist();
}
function payTx(b){ return {id:uid(), kind:'out', amt:b.amt, cat:'bills', sub:b.sub||b.name, merchant:b.name, note:'', date:today(), time:nowHM(), biz:!!b.biz, billId:b.id}; }
function payBill(id){
  const b = S.bills.find(x => x.id===id); if (!b) return;
  const t = payTx(b);
  S.tx.push(t); persist(); buzz(); render();
  toast(`${b.name} marked paid`, () => { S.tx = S.tx.filter(x => x.id!==t.id); persist(); render(); });
}
function payDue(){
  const t = today(), c = billWindow();
  const list = S.bills.filter(b => !paidIn(b,c) && billDue(b,c)<=t).map(payTx);
  if (!list.length) return;
  S.tx.push(...list); persist(); buzz(); render();
  toast(`${list.length} bills marked paid`, () => { S.tx = S.tx.filter(x => !list.includes(x)); persist(); render(); });
}
function unpayBill(id){
  const c = billWindow();
  const gone = S.tx.filter(x => x.billId===id && x.date>=c.start && x.date<=c.end), pre = S.settings.prepaid || {}, had = pre[id];
  const skip = S.settings.ddSkip || (S.settings.ddSkip = {}), key = id+':'+c.start;
  S.tx = S.tx.filter(x => !gone.includes(x)); if (had===c.start) delete pre[id]; skip[key] = true; persist(); render();
  toast('Marked unpaid', () => { S.tx.push(...gone); if (had===c.start) pre[id] = had; delete skip[key]; persist(); render(); });
}
function reviewSheet(){

  openSheet(`<h2>Sort out your bills</h2>

/* ---------- Insights ---------- */
function dailyChart(c){
  const W = 340, H = 140, top = 16, bot = 20, t = today(), plan = pot(c)/planDays(c);
  const vals = [];
  for (let i=0;i<c.days;i++){ const s = ymd(addDays(parse(c.start),i)); vals.push(s>t ? null : Math.max(0, flexNet(S.tx.filter(x => x.date===s)))); }
  const max = Math.max(plan*1.8, ...vals.map(v => v||0), 100);
  const bw = W/c.days, base = H-bot, y = v => top+(base-top)*(1-v/max);
  let g = '';
  vals.forEach((v,i) => {
    const x = (i*bw+bw*.18).toFixed(1), w = (bw*.64).toFixed(1);
    if (v==null){ g += `<rect x="${x}" y="${base-2}" width="${w}" height="2" rx="1" fill="var(--surface-2)"/>`; return; }
    const h = Math.max(2, base-y(v)), isT = ymd(addDays(parse(c.start),i))===t;
    g += `<rect x="${x}" y="${(base-h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="${Math.min(3,bw*.32).toFixed(1)}" fill="${v>plan?'var(--warn)':'var(--good)'}" fill-opacity="${v>plan?1:.7}" ${isT?'stroke="var(--fg)" stroke-width="1.5"':''}><title>${dfmt(ymd(addDays(parse(c.start),i)))}: ${fmt(v)}</title></rect>`;
  });
  const py = y(plan);
  g += `<line x1="0" x2="${W}" y1="${py.toFixed(1)}" y2="${py.toFixed(1)}" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  g += `<text x="0" y="${H-4}" class="cl">${dfmt(c.start)}</text><text x="${W}" y="${H-4}" text-anchor="end" class="cl">${dfmt(c.end)}</text>`;
  const done = vals.filter(v => v!=null), over = done.filter(v => v>plan).length;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Daily flexible spending against plan">${g}</svg><div class="x">${over} of ${done.length} days over plan so far</div>`;
}
function payCard(c, P){
  const first = !!openingFor(c), inc = first ? S.settings.income : incomeFor(c), tgt = S.settings.savings, sh = billShare(c);
  const extra = first ? 0 : extraIn(txIn(c)) + refundsIn(txIn(c)), borrowed = first ? 0 : sum(txIn(c).filter(t => addsIn(t) && t.cat==='borrowed')), whole = inc + extra;
  if (first) P = inc - fixedFor(c) - tgt - potsAside(c);
  const parts = [
    ['Bills', Math.round(sum(billsOfType('bill'))*sh), '#A78BFA'],
    ['Debt repayments', Math.round(sum(billsOfType('debt'))*sh), 'var(--bad)'],
    ['Subscriptions', Math.round(sum(billsOfType('sub'))*sh), '#4FC3F7'],
    ['Savings target', tgt, 'var(--gold)'],
    ['Pots', potsAside(c), '#3DD6B0']
  ].filter(x => x[1]>0);
  const free = Math.max(0,P), pct = v => whole ? Math.round(v/whole*100)+'%' : '';
  const bar = [...parts, ['Left to spend', free, 'var(--good)']].filter(x => x[1]>0).map(([n,v,col]) => `<i style="flex:${v};--c:${col}" title="${n}"></i>`).join('');
  const rows = parts.map(([n,v,col]) => `<div class="prow"><span class="dot" style="--c:${col}"></span><span class="nm">${n}</span><span class="vv">${fmtS(v)}</span><span class="pc">${pct(v)}</span></div>`).join('');
  const total = P>=0
    ? `<div class="prow total"><span class="dot" style="--c:var(--good)"></span><span class="nm">Left to spend</span><span class="vv">${fmtS(P)}</span><span class="pc">${pct(P)}</span></div>`
    : `<div class="prow total short"><span class="dot" style="--c:var(--bad)"></span><span class="nm">Short by</span><span class="vv">${fmtS(-P)}</span><span class="pc"></span></div>`;
  return `<div class="card"><div class="h2">Where your pay goes<small>${first ? 'from your next payday' : `${fmtS(whole)} in this ${isMonthly() ? 'cycle' : periodWord()}`}</small></div><div class="paybar">${bar}</div>${rows}${total}
    <div class="x">${P>=0 ? `That's ${fmtS(P/c.days)} a day for food, travel and everything else.${isMonthly() ? '' : ' Monthly bills are shared across your paydays.'}${borrowed ? ` Includes ${fmtS(borrowed)} borrowed.` : ''}` : `Your fixed costs and savings target are more than your pay this cycle.`}</div></div>`;
}
function planCard(si, L){
  const c = si.c, tgt = savingsFor(c), flex = flexNet(L), o = openingFor(c);
  const from = o ? diffDays(c.start, o.date) : 0, done = [];
  for (let i=from;i<si.dayN-1;i++){ const s = ymd(addDays(parse(c.start),i)); done.push(Math.max(0, flexNet(L.filter(x => x.date===s)))); }
  const need = Math.min(5, Math.ceil(planDays(c)/2));
  const goal = tgt>0 ? `To save your ${fmtS(tgt)}` : 'Until payday';
  if (done.length >= need){
    const typical = median(done), heading = si.P + tgt - (flex + typical*(si.daysLeft-1));
    const cls = heading>=tgt ? 'good' : heading>=0 ? 'warn' : 'bad';
    const word = heading<0 ? fmtS(-heading)+' short' : tgt>0 ? fmtS(heading)+' saved' : fmtS(heading)+' left at payday';
    return `<div class="card"><span class="k">Heading for</span><div class="hv ${cls}">${word}</div><div class="x">${tgt>0 ? `Target ${fmtS(tgt)}. ` : ''}Assumes the rest of the ${o ? 'cycle' : periodWord()} looks like your typical day of ${fmtS(typical)}, so one big buy doesn't skew it.</div></div>`;
  }
  if (si.left < 0) return `<div class="card"><span class="k">${goal}</span><div class="hv bad">${fmtS(-si.left)} over</div><div class="x">Your spending money until payday is used up.${tgt>0 ? ` Anything more comes out of your ${fmtS(tgt)} savings target first.` : ''}</div></div>`;
  // Before today's budget is blown, show today's rate; after, show the new rate from tomorrow
  const ok = si.safe>=0, pd = ok ? si.allowance : si.tomorrow, n = ok ? si.daysLeft : si.daysLeft-1;
  const low = pd!==null && pd < (si.P/planDays(c))*0.6;
  return `<div class="card"><span class="k">${goal}</span><div class="hv ${low?'warn':'good'}">${pd===null ? fmtS(si.left)+' left today' : fmtS(pd)+' a day'}</div><div class="x">${pd===null ? 'Last day before payday.' : `For the next ${n} day${n===1?'':'s'}${ok?', including today':''}. ${fmtS(si.left)} left to spend until payday.`} A forecast appears once you have ${need} days of spending.</div></div>`;
}
function renderInsights(){
  const si = safeInfo(), c = si.c, L = txIn(c), P = si.P;
  const pc = cycleOf(ymd(addDays(parse(c.start),-1)));
  const hasPrev = txIn(pc).length>0;
  const pcCut = ymd(addDays(parse(pc.start),si.dayN-1));
  const PL = txIn(pc).filter(t => t.date<=pcCut);
  const payIn = sum(L.filter(t => t.kind==='in' && t.cat==='salary' && !t.biz)), borrowedIn = sum(L.filter(t => addsIn(t) && t.cat==='borrowed')), otherIn = extraIn(L) - borrowedIn;
  const received = payIn + borrowedIn + otherIn;
  const inParts = [payIn ? fmtS(payIn)+' pay' : 'expected '+fmtS(S.settings.income), borrowedIn ? fmtS(borrowedIn)+' borrowed' : '', otherIn ? fmtS(otherIn)+' other' : ''].filter(Boolean).join(' · ');
  const fixed = fixedFor(c), paid = sum(L.filter(t => t.billId)), flex = flexNet(L);
  const cur = catTotals(L), prv = catTotals(PL);
  const keys = [...OUT_CATS, 'unlogged'].filter(k => (cur[k]||0)>0 || (hasPrev && (prv[k]||0)>0)).sort((a,b) => (cur[b]||0)-(cur[a]||0));
  const catRows = keys.map(k => {
    const v = Math.max(0,cur[k]||0), lim = S.settings.limits[k]||0, pct = lim ? v/lim : 0;
    const col = lim && pct>1 ? 'var(--bad)' : lim && pct>.85 ? 'var(--warn)' : CATS[k].c;
    const dlt = (cur[k]||0)-(prv[k]||0);
    const dtxt = !hasPrev ? '' : Math.abs(dlt)<100 ? 'Same as last cycle' : `${fmtS(Math.abs(dlt))} ${dlt>0?'more':'less'} than last cycle`;
    const line = [dtxt, lim && pct>1 ? 'Over limit' : lim ? `${fmtS(lim-v)} left of limit` : ''].filter(Boolean).join(' · ');
    return `<div class="crow"><span class="ic sm" style="--c:${CATS[k].c}">${ic(CATS[k].i)}</span><span class="nm">${k==='bills'?'One-off bills':CATS[k].n}</span><span class="vv">${fmtS(v)}<small>${lim?' / '+fmtS(lim):''}</small></span><div class="bar"><i style="width:${Math.min(100,pct*100)}%;--c:${col}"></i></div>${line ? `<div class="dl ${hasPrev && dlt>=100?'up':''}">${line}</div>` : ''}</div>`;
  }).join('') || '<p class="hint">No flexible spending yet this cycle.</p>';
  const mm = {};
  for (const t of L){ if (t.kind!=='out'||t.billId||t.biz||!t.merchant) continue; const e = mm[t.merchant] || (mm[t.merchant] = {n:0,v:0,t}); e.n++; e.v += t.amt; }
  const merch = Object.entries(mm).sort((a,b) => b[1].v-a[1].v).slice(0,5).map(([name,e]) => `<div class="mrow"><span class="ic sm" style="--c:${catOf(e.t).c}">${ic(catOf(e.t).i)}</span><span class="nm">${esc(name)}<small>${e.n} visit${e.n>1?'s':''}</small></span><span class="vv">${fmt(e.v)}</span></div>`).join('') || '<p class="hint">Places you spend at will show here.</p>';
  const ty = taxYearStart(), B = S.tx.filter(t => t.biz && t.date>=ty);
  const bOut = sum(B.filter(t => t.kind==='out')), bIn = sum(B.filter(t => t.kind==='in'));

  const hasEx = S.tx.some(t => t.example);
  screen.innerHTML = `
    <header class="hd"><div><h1>Insights</h1><div class="sub">${dfmt(c.start)} to ${dfmt(c.end)} · day ${si.dayN} of ${c.days}</div></div><button class="iconbtn" data-act="settings" aria-label="Settings">${ic('sliders')}</button></header>
    <div class="stack">
      ${hasEx ? `<div class="banner">${ic('info')}<div><p>You're looking at example data. When you're ready, set Kitty up with your own pay and bills.</p><button data-act="setup">Start with my own numbers</button></div></div>` : ''}
      ${borrowBanner()}
      ${planCard(si, L)}
      ${payCard(c, P)}
      <div class="tiles">
        <div class="tile"><span class="k">Money in</span><div class="v">${fmtS(received)}</div><div class="x">${inParts}</div></div>
        <div class="tile"><span class="k">Bills</span><div class="v">${fmtS(fixed)}</div><div class="x">${isMonthly() ? fmtS(paid)+' paid' : 'set aside'}</div></div>
        <div class="tile"><span class="k">Spent</span><div class="v">${fmtS(flex)}</div><div class="x">of ${fmtS(Math.max(0,P))}${refundsIn(L) ? ` · ${fmtS(refundsIn(L))} refunded` : ''}</div></div>
      </div>
      <div class="card"><div class="h2">Day by day<small style="color:var(--gold)">- - ${fmtS(Math.round(P/planDays(c)))} a day plan</small></div>${dailyChart(c)}</div>

  $('#b-t').addEventListener('change', e => { $('#b-bal-w').hidden = e.target.value!=='debt'; });
  if (b) armButton($('#b-del'), 'Tap again to delete', () => { S.bills = S.bills.filter(x => x!==b); persist(); closeSheet(); render(); toast(`${b.name} removed`); });
  $('#b-save').addEventListener('click', () => {
    const name = $('#b-n').value.trim(), amt = num($('#b-a').value), type = $('#b-t').value;
    if (!name){ $('#b-n').classList.add('err'); $('#b-n').focus(); return; }
    if (!amt){ $('#b-a').classList.add('err'); $('#b-a').focus(); return; }
    let balance = null;
    const bv = $('#b-bal').value.trim();
    if (type==='debt' && bv){ balance = num(bv); if (balance===null){ $('#b-bal').classList.add('err'); $('#b-bal').focus(); return; } }
    const o = {name, amt, day:+$('#b-d').value, type, biz, sub: type==='sub' ? 'Subscription' : type==='debt' ? 'Debt repayment' : name,
      balance, balanceAt: balance ? today()+' '+nowHM() : null, dd: $('#b-dd').checked};
    if (o.dd && !(b && b.dd)) o.ddFrom = today();
    if (b){ Object.assign(b,o); syncBiz(b); } else S.bills.push({id:'b'+uid(), ...o});
    persist(); closeSheet(); render(); toast(b ? 'Bill updated' : `${name} added`);
  });
}

/* ---------- Accounts + check-in sheets ---------- */
function accountsSheet(thenCheckin){
  const debts = billsOfType('debt');
  const guess = name => (matchDebt(name)||{}).id || '';
  const rowHtml = (a,i) => `<div class="acct" data-i="${i}">
      <div class="two"><label>Name<input class="an" value="${esc(a.name)}" placeholder="e.g. Monzo"></label>
      <label>Type<select class="at"><option value="current" ${a.type!=='credit'?'selected':''}>Current account</option><option value="credit" ${a.type==='credit'?'selected':''}>Credit card or credit</option></select></label></div>
      ${debts.length ? `<label class="ad-w" ${a.type==='credit'?'':'hidden'}>Paid off by this bill<select class="ad"><option value="">None</option>${debts.map(b => `<option value="${b.id}" ${b.id===(a.debtId||'')?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>` : ''}
      <button type="button" class="link rm">Remove</button>
    </div>`;
  const list = S.accounts.length ? S.accounts.map(a => ({...a})) : [{id:'a'+uid(), name:'Main account', type:'current'}];
  openSheet(`<h2>Your accounts</h2>
    <div class="form">
      <p class="hint">Add the accounts you spend from: current accounts and credit cards. Leave savings out. Balances stay on this phone.</p>
      <div id="acct-list">${list.map(rowHtml).join('')}</div>
      <button class="btn" type="button" id="acct-add">${ic('plus')}Add an account</button>
      <div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="acct-save">${thenCheckin ? 'Next' : 'Save'}</button></div>
    </div>`);
  const box = $('#acct-list');
  box.addEventListener('change', e => {
    const row = e.target.closest('.acct'); if (!row) return;
    if (e.target.classList.contains('at')){ const w = row.querySelector('.ad-w'); if (w){ w.hidden = e.target.value!=='credit'; if (e.target.value==='credit' && !row.querySelector('.ad').value) row.querySelector('.ad').value = guess(row.querySelector('.an').value); } }
  });
  box.addEventListener('input', e => {
    if (!e.target.classList.contains('an')) return;
    const row = e.target.closest('.acct'), ad = row.querySelector('.ad'), g = guess(e.target.value);
    if (g && ad && !ad.value){ row.querySelector('.at').value = 'credit'; row.querySelector('.ad-w').hidden = false; ad.value = g; }
  });
  box.addEventListener('click', e => { if (e.target.classList.contains('rm')) e.target.closest('.acct').remove(); });
  $('#acct-add').addEventListener('click', () => { list.push({id:'a'+uid(), name:'', type:'current'}); box.insertAdjacentHTML('beforeend', rowHtml(list[list.length-1], list.length-1)); box.lastElementChild.querySelector('.an').focus(); });
  $('#acct-save').addEventListener('click', () => {
    const rows = [...box.querySelectorAll('.acct')];
    const out = rows.map(r => { const i = +r.dataset.i; const ad = r.querySelector('.ad'); return {id:list[i].id, name:r.querySelector('.an').value.trim(), type:r.querySelector('.at').value, debtId: ad && r.querySelector('.at').value==='credit' ? (ad.value||null) : null}; });
    const bad = rows.find((r,i) => !out[i].name); if (bad){ bad.querySelector('.an').classList.add('err'); bad.querySelector('.an').focus(); return; }
    if (!out.length){ toast('Add at least one account'); return; }
    const changed = JSON.stringify(out.map(a => [a.id,a.type])) !== JSON.stringify(S.accounts.map(a => [a.id,a.type]));
    S.accounts = out;
    // A different set of accounts needs a fresh starting point
    if (changed && S.checkins.length) S.checkins.push({id:uid(), at:today()+' '+nowHM(), reset:true, bal:null, net:null, moved:0});
    persist();
    if (thenCheckin) checkinSheet(); else { closeSheet(); render(); toast('Accounts saved'); }
  });
}
function checkinSheet(){
  if (!S.accounts.length) return accountsSheet(true);
  const last = lastCheckin(), base = last && !last.reset ? last : null;
  openSheet(`<h2>Check your balance</h2>
    <div class="form">
      <p class="hint">${base ? `Open your banking app and enter what it says now. Kitty compares it with what you've logged since ${dfmt(base.at.slice(0,10))}.` : `Open your banking app and enter what it says now. This is your starting point. From the next check, Kitty spots anything you didn't log.`}</p>
      ${S.accounts.map(a => `<label>${esc(a.name)} ${a.type==='credit' ? '<small class="lbl2">amount owed</small>' : '<small class="lbl2">balance</small>'}<input id="cb-${a.id}" inputmode="decimal" placeholder="${a.type==='credit'?'0.00 owed':'0.00'}"></label>`).join('')}
      ${S.accounts.some(a => a.type!=='credit') ? `<p class="hint">Overdrawn? Put a minus sign in front, like -120.</p>` : ''}
      ${base ? `<label>Moved to savings since last check (optional)<input id="cb-moved" inputmode="decimal" placeholder="0"></label>` : ''}
      <div class="btns"><button class="btn" type="button" id="cb-acc">Accounts</button><button class="btn primary" id="cb-go">Check</button></div>
    </div>`);
  $('#cb-acc').addEventListener('click', () => accountsSheet(true));
  $('#sheet').querySelector('input').focus();
  $('#cb-go').addEventListener('click', () => {
    const bal = {};
    for (const a of S.accounts){
      const el = $('#cb-'+a.id), raw = el.value.trim();
      if (raw===''){ el.classList.add('err'); el.focus(); return; }
      const neg = /^\s*[-−]/.test(raw), v = num(raw); if (v===null){ el.classList.add('err'); el.focus(); return; }
      bal[a.id] = neg ? -v : v;
    }
    const moved = base ? (num(($('#cb-moved')||{}).value||'0')||0) : 0;
    const at = today()+' '+nowHM(), net = netOf(bal);
    const ci = {id:uid(), at, bal, net, moved};
    if (!base){ S.checkins.push(ci); persist(); closeSheet(); render(); toast('Starting point saved. Next time Kitty will spot anything you missed'); return; }
    const expected = base.net + loggedSince(base.at) - moved, gap = expected - net;
    S.checkins.push(ci);
    if (Math.abs(gap) < 100){ persist(); closeSheet(); render(); toast('Everything matches what you logged'); return; }
    if (gap > 0){
      const t = {id:uid(), kind:'out', amt:gap, cat:'unlogged', sub:'Not logged', merchant:'Not logged', note:'', date:today(), time:nowHM(), biz:false, billId:null, checkin:true, since:base.at.slice(0,10)};
      S.tx.push(t); ci.adjTx = t.id; persist(); render();
      const si = safeInfo();
      openSheet(`<h2>${fmt(gap)} not logged</h2>
        <div class="form">
          <p class="lead2">Since ${dfmt(base.at.slice(0,10))} your balance dropped ${fmt(gap)} more than the spending you logged. It's been added as "Not logged" so your budget stays right.</p>
          <div class="sumcard">${row2('Safe to spend today', fmtS(si.safe), si.safe<0)}${si.tomorrow!==null ? row2('From tomorrow', fmtS(si.tomorrow)+' a day', si.tomorrow<0) : ''}</div>
          <p class="hint">Remember what it was? Log it with the right date and Kitty takes it off this amount.</p>
          <div class="btns"><button class="btn" id="ci-undo">Undo check</button><button class="btn primary" data-act="close">Done</button></div>
        </div>`);
      $('#ci-undo').addEventListener('click', () => { S.tx = S.tx.filter(x => x.id!==t.id); S.checkins = S.checkins.filter(x => x!==ci); persist(); closeSheet(); render(); toast('Check undone'); });
    } else {
      persist(); render();
      openSheet(`<h2>${fmt(-gap)} more than expected</h2>
        <div class="form">
          <p class="lead2">You have ${fmt(-gap)} more than Kitty expected. That happens when money came in that you didn't log, or a bill hasn't gone out yet.</p>
          <div class="btns"><button class="btn" data-act="close">Leave it</button><button class="btn primary" id="ci-add">Add as extra money</button></div>
        </div>`);
      $('#ci-add').addEventListener('click', () => { const t = {id:uid(), kind:'in', amt:-gap, cat:'extra', sub:null, merchant:'Not logged', note:'', date:today(), time:nowHM(), biz:false, billId:null, checkin:true, since:base.at.slice(0,10)}; S.tx.push(t); ci.adjTx = t.id; persist(); closeSheet(); render(); toast(`${fmt(-gap)} added to your spending money`); });
    }
  });
}

function catsSheet(){

      </div>`).join('')}</div>
      <button class="btn" type="button" id="cat-add">${ic('plus')}Add a category</button>

    </div>`);

    const b = e.target.closest('[data-c]'); if (!b) return;
    const row = b.closest('.catrow'), c = b.dataset.c;
    if (c==='up' && row.previousElementSibling) box.insertBefore(row, row.previousElementSibling);
    if (c==='down' && row.nextElementSibling) box.insertBefore(row.nextElementSibling, row);
    if (c==='hide'){ row.classList.toggle('off'); b.innerHTML = ic(row.classList.contains('off') ? 'eyeoff' : 'eye'); }
    if (c==='del') row.remove();

    const rows = [...box.querySelectorAll('.catrow')], keep = new Set(rows.map(r => r.dataset.k));

    if (rows.length - st.hiddenCats.length < 1){ toast('Keep at least one category showing'); return false; }
    st.catNames = st.catNames || {};
    st.customCats = (st.customCats||[]).filter(c => keep.has(c.id));
    rows.forEach(r => { const k = r.dataset.k, n = r.querySelector('input').value.trim() || CATS[k].n;

/* ---------- Pay fields (setup + settings) ---------- */
function payFieldsHtml(st, px){
  const f = st.payFreq || 'monthly';
  return `<label>How often are you paid?<select id="${px}-freq">${Object.entries(FREQS).map(([k,n]) => `<option value="${k}" ${k===f?'selected':''}>${n}</option>`).join('')}</select></label>
    <label id="${px}-day-w" ${f==='monthly'?'':'hidden'}>Payday<select id="${px}-day">${Array.from({length:31},(_,i) => `<option value="${i+1}" ${i+1===(st.payday||28)?'selected':''}>${ord(i+1)} of the month</option>`).join('')}</select></label>
    <label id="${px}-anc-w" ${FREQ_DAYS[f]?'':'hidden'}>A recent or upcoming payday<input type="date" id="${px}-anc" value="${st.payAnchor||today()}"></label>
    <p class="hint" id="${px}-freq-h">${f==='lastwd' ? 'Weekends are skipped. Bank holidays are not yet.' : f==='monthly' ? 'In shorter months, a 29th to 31st payday moves to the last day.' : 'Kitty counts forward from this date.'}</p>`;
}
function wirePayFields(px){
  $('#'+px+'-freq').addEventListener('change', e => {
    const f = e.target.value;
    $('#'+px+'-day-w').hidden = f!=='monthly'; $('#'+px+'-anc-w').hidden = !FREQ_DAYS[f];
    $('#'+px+'-freq-h').textContent = f==='lastwd' ? 'Weekends are skipped. Bank holidays are not yet.' : f==='monthly' ? 'In shorter months, a 29th to 31st payday moves to the last day.' : 'Kitty counts forward from this date.';
  });
}
function readPayFields(px){
  const f = $('#'+px+'-freq').value, o = {payFreq:f, payday:+$('#'+px+'-day').value};
  if (FREQ_DAYS[f]){ const a = $('#'+px+'-anc').value; if (!a){ $('#'+px+'-anc').classList.add('err'); $('#'+px+'-anc').focus(); return null; } o.payAnchor = a; }
  return o;
}
function fitLimits(budget){
  const tot = Object.values(DEFAULT_LIMITS).reduce((a,v) => a+v, 0), f = Math.max(0,budget)/tot, o = {};
  for (const k in DEFAULT_LIMITS) o[k] = Math.floor(DEFAULT_LIMITS[k]*f/500)*500;
  return o;
}

/* ---------- First-run setup ---------- */
const COMMON_BILLS = [['Rent or mortgage','bill'],['Council tax','bill','GBP'],['Gas & electric','bill'],['Water','bill'],['Mobile phone','bill'],['Broadband','bill'],['TV & streaming','sub'],['Insurance','bill'],['Loan or credit card','debt']];
let ob = null;
function startSetup(){
  const st = S.settings.setupDone && !S.tx.some(t => t.example) ? S.settings : DEFAULT_SETTINGS;
  ob = {step: S.settings.setupDone ? 1 : 0, st:{currency:st.currency, payFreq:st.payFreq, payday:st.payday, payAnchor:st.payAnchor||today(), income:st.income, savings:st.savings, sideIncome:st.sideIncome},
    bills: COMMON_BILLS.map(([name,type,cur]) => ({name,type,cur,amt:'',day:1}))};
  renderSetup();
}
function obMoney(id, v, label){ return `<label class="money" aria-label="${label}"><span>${esc(CURRENCIES[ob.st.currency].s.trim())}</span><input id="${id}" inputmode="decimal" placeholder="0" value="${v ? (v/100).toFixed(v%100?2:0) : ''}"></label>`; }
function obPot(){
  const st = {...S.settings, ...ob.st}, t = today(), c = cycleOf(t, st), weekly = !!FREQ_DAYS[st.payFreq];
  const list = ob.bills.filter(b => !b.cur || b.cur===st.currency).map(b => ({amt:num(b.amt)||0, day:b.day})).filter(b => b.amt);
  const total = list.reduce((a,b) => a+b.amt, 0), share = weekly ? c.days*12/365 : 1;
  const daysLeft = diffDays(t,c.end)+1, mid = diffDays(c.start,t) > 0;
  const rem = weekly ? Math.round(total*12/365*daysLeft) : list.filter(b => billDue(b,c) >= t).reduce((a,b) => a+b.amt, 0);
  const bills = Math.round(total*share);
  return {c, bills, left: st.income - bills - st.savings, mid, daysLeft, rem, next: ymd(addDays(parse(c.end),1)), first: st.balance==null ? null : st.balance - rem};
}
function renderSetup(){
  const el = $('#setup'), st = ob.st, step = ob.step;
  const top = step>0 ? `<div class="obtop"><button class="iconbtn" data-ob="back" aria-label="Back">${ic('chev')}</button><div class="dots" aria-label="Step ${step} of 4">${[1,2,3,4].map(i => `<i class="${i<=step?'on':''}"></i>`).join('')}</div><span style="width:42px"></span></div>` : '';
  let body = '';
  if (step===0) body = `
    <div class="obhero" aria-hidden="true">
      <div class="strip"><div><span class="k">Safe to spend today</span><b class="big">£24.50</b></div><div class="r"><span class="k">Day 9 of 31</span><span class="after">£21.80 daily budget</span></div></div>
      <div class="strip"><div><span class="k">Over budget today</span><b class="big bad">£12.00</b></div><div class="r"><span class="k">Day 10 of 31</span><span class="after">£20.70/day from tomorrow</span></div></div>
    </div>
    <h1>Know what's safe to spend today</h1>
    <p class="lead">Tell Kitty when you're paid and what your bills are. It works out how much you can spend each day until your next payday, and adjusts as you go.</p>
    <span class="grow"></span>
    <button class="save" data-ob="next">Get started</button>
    <button class="btn" data-ob="example">Look around with example data</button>
    <p class="small">No account and no bank login. Everything stays on this phone.</p>`;
  if (step===1) body = `
    <h1>When do you get paid?</h1>
    <div class="form">
      <label>Currency<select id="ob-cur">${Object.entries(CURRENCIES).map(([k,c]) => `<option value="${k}" ${k===st.currency?'selected':''}>${c.n}</option>`).join('')}</select></label>
      ${payFieldsHtml(st,'ob')}
    </div>
    <span class="grow"></span><button class="save" data-ob="next">Next</button>`;
  if (step===2) body = `
    <h1>How much do you take home each payday?</h1>
    <p class="lead">After tax. If it changes, use a typical amount. Kitty switches to the real figure when you log your pay.</p>
    ${obMoney('ob-inc', st.income, 'Take-home pay')}
    <label class="toggle"><input type="checkbox" id="ob-side" ${st.sideIncome?'checked':''}><span>I also have side income or I'm self-employed<small>Keeps work costs and income out of your personal budget, and gives you a CSV for your tax records.</small></span></label>
    <span class="grow"></span><button class="save" data-ob="next">Next</button>`;
  if (step===3){
    const rows = ob.bills.filter(b => !b.cur || b.cur===st.currency);
    body = `
    <h1>Your regular bills</h1>
    <p class="lead">Fill in what you pay each month and leave the rest blank. You can change these any time.</p>
    <div class="obhead"><span>Bill</span><span style="text-align:right">Amount</span><span>Due</span></div>
    <div class="obrows">${rows.map(b => { const i = ob.bills.indexOf(b); return `<div class="obrow"><input aria-label="Bill name" id="obn-${i}" value="${esc(b.name)}"><input class="a" aria-label="${esc(b.name)} amount" id="oba-${i}" inputmode="decimal" placeholder="0" value="${esc(b.amt)}"><select aria-label="${esc(b.name)} due day" id="obd-${i}">${Array.from({length:31},(_,d) => `<option value="${d+1}" ${d+1===b.day?'selected':''}>${ord(d+1)}</option>`).join('')}</select></div>`; }).join('')}</div>
    <button class="btn" data-ob="addbill">${ic('plus')}Add another bill</button>
    <span class="grow"></span><button class="save" data-ob="next">Next</button>`;
  }
  if (step===4){
    const r = obPot(), d = r.left/r.c.days, pw = PERIOD[st.payFreq];
    body = `
    <h1>Anything to save?</h1>
    <p class="lead">Kitty sets this aside on payday, so it never counts as spending money. Zero is fine.</p>
    ${obMoney('ob-sav', st.savings, 'Savings each payday')}
    ${r.mid ? `<h1 style="font-size:22px;margin-top:8px">How much money do you have right now?</h1>
    <p class="lead">You're part-way to your next payday on ${dfmt(r.next)}. Check your banking app and enter what you have to last until then.</p>
    ${obMoney('ob-bal', st.balance, 'Money you have now')}` : ''}
    <div class="sumcard" id="ob-sum">${obSummary(r)}</div>
    <span class="grow"></span><button class="save" data-ob="finish">Start using Kitty</button>`;
  }
  el.innerHTML = `<div class="ob">${top}${body}</div>`;
  el.hidden = false; el.scrollTop = 0;
  if (step===1) wirePayFields('ob');
}
function obSummary(r){
  const st = ob.st, monthlyPay = !FREQ_DAYS[st.payFreq];
  const row = (n,v,col,cls='') => `<div class="prow ${cls}"><span class="dot" style="--c:${col}"></span><span class="nm">${n}</span><span class="vv">${v}</span><span class="pc"></span></div>`;
  const f = v => { const c = CURRENCIES[st.currency].s; return (v<0?'−':'')+c+(Math.abs(v)/100).toLocaleString('en-GB',{maximumFractionDigits:0}); };
  const typical = `${r.left>=0 ? `About ${f(Math.round(r.left/r.c.days))} a day` : 'Bills and savings are more than your pay'}`;
  if (r.mid){
    if (r.first===null) return `<div class="x" style="padding:8px 0 2px">Enter what you have now to see your daily budget until ${dfmt(r.next)}.</div>`;
    return row('You have now', f(st.balance), 'var(--muted)') + row('Bills still to come', '−'+f(r.rem), '#A78BFA')
      + row(r.first>=0 ? 'To spend until payday' : 'Short by', f(Math.abs(r.first)), r.first>=0 ? 'var(--good)' : 'var(--bad)', 'total'+(r.first<0?' short':''))
      + `<div class="x">${r.first>=0 ? `About ${f(Math.round(r.first/r.daysLeft))} a day for the next ${r.daysLeft} day${r.daysLeft===1?'':'s'}.` : `That won't cover the bills still to come before ${dfmt(r.next)}.`} From ${dfmt(r.next)}: ${typical.toLowerCase()}${r.left>=0 ? ', after bills and savings.' : '.'}</div>`;
  }
  return row('Take-home pay', f(st.income), 'var(--muted)') + row(monthlyPay ? 'Bills' : 'Bills set aside', '−'+f(r.bills), '#A78BFA') + row('Savings', '−'+f(st.savings), 'var(--gold)')
    + row(r.left>=0 ? 'To spend' : 'Short by', f(Math.abs(r.left)), r.left>=0 ? 'var(--good)' : 'var(--bad)', 'total'+(r.left<0?' short':''))
    + `<div class="x">${r.left>=0 ? `${typical} for food, travel and everything else.` : 'Your bills and savings are more than your pay. Try a smaller savings amount, or check your bills.'}</div>`;
}
function obRead(validate){
  const st = ob.st;
  if (ob.step===1){
    st.currency = $('#ob-cur').value;
    const pay = readPayFields('ob'); if (!pay) return false; Object.assign(st, pay);
  }
  if (ob.step===2){
    const v = num($('#ob-inc').value); st.sideIncome = $('#ob-side').checked;
    if (validate && !v){ $('#ob-inc').closest('.money').classList.add('err'); $('#ob-inc').focus(); return false; }
    st.income = v || 0;
  }
  if (ob.step===3) ob.bills.forEach((b,i) => { const n = $('#obn-'+i); if (!n) return; b.name = n.value.trim(); b.amt = $('#oba-'+i).value.trim(); b.day = +$('#obd-'+i).value; });
  if (ob.step===4){
    st.savings = num($('#ob-sav').value) || 0;
    const bal = $('#ob-bal');
    if (bal){ const v = num(bal.value); st.balance = bal.value.trim()==='' ? null : v;
      if (validate && st.balance===null){ bal.closest('.money').classList.add('err'); bal.focus(); toast('Enter the money you have now, even if it is 0'); return false; } }
    else st.balance = null;
  }
  return true;
}
function finishSetup(){
  if (!obRead(true)) return;
  const st = ob.st, r = obPot();
  const bills = ob.bills.filter(b => b.name && num(b.amt)).map(b => ({id:'b'+uid(), name:b.name, amt:num(b.amt), day:b.day, type:b.type, biz:false, dd:true, ddFrom:today(), sub: b.type==='sub' ? 'Subscription' : b.type==='debt' ? 'Debt repayment' : b.name}));
  const keep = S.settings.setupDone && !S.tx.some(t => t.example);
  S = keep ? S : blank();
  if (keep) S.bills = S.bills.concat(bills.filter(nb => !S.bills.some(b => b.name.toLowerCase()===nb.name.toLowerCase())));
  else S.bills = bills;
  const balance = st.balance; delete st.balance;
  Object.assign(S.settings, st, {setupDone:true, _v2:true});
  if (!keep){
    S.settings.limits = fitLimits(r.left);
    const t = today(), w = billWindow(), c = curCycle();
    S.settings.prepaid = {}; S.bills.forEach(b => { if (billDue(b,w) < t) S.settings.prepaid[b.id] = w.start; });
    S.settings.opening = r.mid && balance!=null ? {start:c.start, date:t, pot:r.first} : null;
    if (balance!=null){ S.accounts = [{id:'a'+uid(), name:'Main account', type:'current'}]; S.checkins = [{id:uid(), at:t+' '+nowHM(), bal:{[S.accounts[0].id]:balance}, net:balance, moved:0}]; }
  }
  persist(); ob = null; $('#setup').hidden = true; $('#setup').innerHTML = '';
  tab = 'log'; draft = newDraft(); render();
  toast(keep ? 'Settings updated' : "You're set up. Log your first spend");
}
$('#setup').addEventListener('click', e => {
  const b = e.target.closest('[data-ob]'); if (!b) return;
  const a = b.dataset.ob;
  if (a==='next'){ if (!obRead(true)) return; ob.step++; renderSetup(); }
  else if (a==='back'){ obRead(false); if (ob.step <= 1 && S.settings.setupDone){ ob = null; $('#setup').hidden = true; return; } ob.step--; renderSetup(); }
  else if (a==='example'){ S = seed(); persist(); ob = null; $('#setup').hidden = true; tab = 'insights'; render(); toast('Example data loaded. Set up with your own numbers any time'); }
  else if (a==='addbill'){ obRead(false); ob.bills.push({name:'', type:'bill', amt:'', day:1}); renderSetup(); const i = ob.bills.length-1; $('#obn-'+i).focus(); }
  else if (a==='finish') finishSetup();
});
$('#setup').addEventListener('input', e => {
  if (e.target.closest('.money')) e.target.closest('.money').classList.remove('err');
  if (e.target.id==='ob-sav' || e.target.id==='ob-bal'){ obRead(false); $('#ob-sum').innerHTML = obSummary(obPot()); }
});
$('#setup').addEventListener('change', e => { if (e.target.id==='ob-cur') ob.st.currency = e.target.value; });

/* ---------- Toast ---------- */
let toastT;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undo">Undo</button>' : ''}`;
  el.hidden = false; clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; }, undo ? 5000 : 2600);
  if (undo) $('#undo').addEventListener('click', () => { clearTimeout(toastT); el.hidden = true; undo(); });
}

/* ---------- Events ---------- */
const app = $('#app');
app.addEventListener('click', e => {
  if (e.target.id==='d-in'){ try { e.target.showPicker(); } catch(_) {} return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act){
    case 'tab': tab = v; closeSheet(); render(); screen.scrollTop = 0; break;
    case 'mode': if (draft.mode!==v){ const amt = draft.amt; draft = newDraft(v); draft.amt = amt; renderLog(); } break;
    case 'key': keyIn(v); break;
    case 'save': doSave(); break;
    case 'cat': draft.cat = v; draft.catAuto = false; draft.catManual = true; draft.sub = null; buzz(); if (!$('#sheet-wrap').hidden) closeSheet(); updateLog(); break;
    case 'pick': { const m = memory().get(draft.mode+':'+b.dataset.k.toLowerCase()); if (m){ draft.merchant = m.name; $('#m-in').value = m.name; applyMem(m); buzz(); updateLog(); } break; }
    case 'date': draft.dateMode = v; draft.date = v==='today' ? today() : yesterday(); updateLog(); break;
    case 'note': draft.showNote = !draft.showNote; updateLog(); if (draft.showNote) $('#note-in').focus(); break;
    case 'biz': draft.biz = !draft.biz; buzz(); updateLog(); break;
    case 'filter': actFilter = v; renderActivity(); break;
    case 'edit': editTx(b.dataset.id); break;
    case 'bill-pay': payBill(v); break;
    case 'bill-unpay': unpayBill(v); break;
    case 'bill-edit': billSheet(v); break;
    case 'bill-add': billSheet(null); break;
    case 'bill-review': reviewSheet(); break;
    case 'pay-due': payDue(); break;
    case 'pot-new': potSheet(null, v); break;
    case 'pot-edit': potSheet(v); break;
    case 'pot-topup': topUpSheet(v); break;
    case 'checkin': checkinSheet(); break;
    case 'dd-ok': S.settings.ddNotice = false; persist(); render(); break;
    case 'morecats': moreCatsSheet(); break;
    case 'editcats': catsSheet(); break;
    case 'mark-borrow': { const t = S.tx.find(x => x.id===b.dataset.id), d = t && matchDebt(t.merchant); if (t){ t.cat = 'borrowed'; if (d) t.debtId = d.id; persist(); render(); toast('Marked as borrowed'); } break; }
    case 'not-borrow': S.settings.dismissed['tx:'+b.dataset.id] = true; persist(); render(); break;
    case 'pots': draft.showPots = !draft.showPots; updateLog(); break;
    case 'potsel': draft.potId = v; draft.showPots = false; buzz(); updateLog(); break;
    case 'settings': settingsSheet(); break;
    case 'setup': startSetup(); break;
    case 'csv': copyCsv(); break;
    case 'close': closeSheet(); break;
  }
});
app.addEventListener('input', e => {
  const id = e.target.id;
  if (id==='m-in'){
    draft.merchant = e.target.value;
    const q = draft.merchant.trim().toLowerCase(), mem = memory();
    const m = mem.get(draft.mode+':'+q);
    if (m) applyMem(m);
    else if (draft.mode==='in' && draft.cat==='refund'){ const o = mem.get('out:'+q); if (o) draft.refundCat = o.cat; }
    else if (draft.mode==='in' && !draft.catManual){ const db = matchDebt(q); if (db){ draft.cat = 'borrowed'; draft.debtId = db.id; } }
    updateLog();
  }
  else if (id==='note-in') draft.note = e.target.value;
  else if (id==='q'){ actQuery = e.target.value; renderActList(); }
  else if (e.target.classList.contains('err')) e.target.classList.remove('err');
});
app.addEventListener('change', e => {
  const id = e.target.id;
  if (id==='d-in' && e.target.value){
    draft.date = e.target.value > today() ? today() : e.target.value;
    draft.dateMode = draft.date===today() ? 'today' : draft.date===yesterday() ? 'yesterday' : 'pick';
    updateLog();
  } else if (id==='rc') draft.refundCat = e.target.value;
  else if (id==='dl') draft.debtId = e.target.value;
});
document.addEventListener('keydown', e => {
  if (!$('#setup').hidden) return;
  if (!$('#sheet-wrap').hidden){ if (e.key==='Escape') closeSheet(); return; }
  if (tab!=='log') return;
  if (e.target.matches('input,select,textarea')){ if (e.key==='Enter' && (e.target.id==='m-in'||e.target.id==='note-in')) e.target.blur(); return; }
  if (/^[0-9]$/.test(e.key)) keyIn(e.key);
  else if (e.key==='.') keyIn('.');
  else if (e.key==='Backspace') keyIn('del');
  else if (e.key==='Enter') doSave();
});

render();
if (!S.settings.setupDone) startSetup();
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
</script>
